name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract (Japanese)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: createdb t
      - run: psql -d t -v ON_ERROR_STOP=1 -f supabase/tests/supabase_stub.sql -f supabase/migrations/20261107000000_init.sql
      - run: psql -d t -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
